<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Comfort Design System is a detailed reference for calm, clear, and trustworthy product interfaces."
    />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Comfort Design System" />
    <meta
      property="og:description"
      content="Explore the principles, foundations, components, states, and guidance behind Comfort Design System."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://chann.github.io/design/comfort-hero.webp"
    />
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" />
    <title>Comfort Design System</title>
    <script>
      try {
        const theme = localStorage.getItem("comfort-theme");
        const dark =
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
